<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatbot Suite</title>
<style>
  :root {
    --bg: #f4f4f0;
    --surface: #ffffff;
    --ink: #1d1f24;
    --muted: #6b7280;
    --accent: #175e54;
    --accent-soft: #e3efec;
    --border: #e3e2dc;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .tagline { font-size: 13px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 26px 0 12px; }
  .inner { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 15px;
    overflow-wrap: break-word;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
  .bubble code {
    background: rgba(0,0,0,.06);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  .status { font-size: 12.5px; color: var(--muted); margin: -6px 0 14px 4px; font-style: italic; }
  .notice { color: #a03a2e; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
  .chips button {
    font: inherit; font-size: 13.5px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--accent);
    cursor: pointer; transition: background .15s;
  }
  .chips button:hover { background: var(--accent-soft); }
  form.composer { display: flex; gap: 10px; padding: 14px 20px 20px; background: linear-gradient(transparent, var(--bg) 30%); }
  form.composer .inner { display: flex; gap: 10px; width: 100%; }
  input[type=text] {
    flex: 1; font: inherit; font-size: 15px; padding: 13px 16px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.send {
    font: inherit; font-weight: 600; padding: 0 22px; border-radius: var(--radius);
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .cursor::after { content: "▋"; animation: blink 1s step-end infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  /* landing card when no ?bot= param */
  .landing {
    max-width: 460px; margin: 12vh auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 30px;
  }
  .landing h2 { margin: 0 0 6px; font-size: 18px; }
  .landing p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .landing input { width: 100%; margin: 10px 0; }
  .landing button { width: 100%; padding: 12px; }
</style>
</head>
<body>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const botId = params.get("bot");

  // ── No bot selected: show a small landing card ─────────────────────────
  if (!botId) {
    document.body.innerHTML = `
      <div class="landing">
        <h2>Chatbot Suite</h2>
        <p>This page hosts the embeddable chat widget. Open it with your bot's
           public id — shown when you create a bot or run the seed script:</p>
        <form id="pick">
          <input type="text" id="pid" placeholder="bot public id (uuid)" />
          <button class="send" type="submit">Open widget</button>
        </form>
      </div>`;
    document.getElementById("pick").addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("pid").value.trim();
      if (id) location.search = "?bot=" + encodeURIComponent(id);
    });
    return;
  }

  // ── Chat UI ─────────────────────────────────────────────────────────────
  document.body.innerHTML = `
    <header>
      <div>
        <h1 id="bot-name">Loading…</h1>
        <div class="tagline" id="bot-tagline"></div>
      </div>
    </header>
    <div id="chat"><div class="inner" id="messages"></div></div>
    <form class="composer" id="composer">
      <div class="inner">
        <input id="input" type="text" placeholder="Type a message…" autocomplete="off" />
        <button class="send" id="send" type="submit">Send</button>
      </div>
    </form>`;

  const els = {
    name: document.getElementById("bot-name"),
    tagline: document.getElementById("bot-tagline"),
    chat: document.getElementById("chat"),
    messages: document.getElementById("messages"),
    form: document.getElementById("composer"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
  };

  let conversationId = null;
  let busy = false;

  const escapeHtml = (s) =>
    s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function renderMarkdown(text) {
    const lines = escapeHtml(text).split("\n");
    const out = [];
    let list = null;
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    const inline = (s) =>
      s.replace(/`([^`]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    for (const line of lines) {
      const ul = /^\s*[-*]\s+(.*)/.exec(line);
      const ol = /^\s*\d+[.)]\s+(.*)/.exec(line);
      if (ul) {
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push(`<li>${inline(ul[1])}</li>`);
      } else if (ol) {
        if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
        out.push(`<li>${inline(ol[1])}</li>`);
      } else if (!line.trim()) {
        closeList(); out.push("<p></p>");
      } else {
        closeList(); out.push(`<p>${inline(line)}</p>`);
      }
    }
    closeList();
    return out.join("").replace(/(<p><\/p>)+/g, "");
  }

  const scrollDown = () => { els.chat.scrollTop = els.chat.scrollHeight; };

  function addMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") bubble.textContent = text;
    else bubble.innerHTML = renderMarkdown(text);
    wrap.appendChild(bubble);
    els.messages.appendChild(wrap);
    scrollDown();
    return bubble;
  }

  function addStatus(text) {
    const div = document.createElement("div");
    div.className = "status";
    div.textContent = text;
    els.messages.appendChild(div);
    scrollDown();
    return div;
  }

  function addChips(questions) {
    if (!questions || !questions.length) return;
    const div = document.createElement("div");
    div.className = "chips";
    for (const q of questions) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => { els.input.value = q; els.form.requestSubmit(); };
      div.appendChild(b);
    }
    els.messages.appendChild(div);
    scrollDown();
  }

  async function streamChat(message, onEvent) {
    const res = await fetch("/v1/public/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ botId, conversationId, message }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || body.message || `Request failed (${res.status})`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let event = "message", data = "";
        for (const line of raw.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        if (data) onEvent(event, JSON.parse(data));
      }
    }
  }

  const toolLabel = (name) =>
    ({
      search_knowledge: "Searching the knowledge base…",
      capture_lead: "Saving your details…",
    })[name] || `Running ${name}…`;

  async function send(message) {
    if (busy) return;
    busy = true;
    els.send.disabled = true;
    document.querySelectorAll(".chips").forEach((c) => c.remove());
    addMessage("user", message);

    let bubble = null, raw = "", statusEl = null;
    try {
      await streamChat(message, (event, data) => {
        switch (event) {
          case "conversation":
            conversationId = data.conversationId;
            break;
          case "text":
            if (statusEl) { statusEl.remove(); statusEl = null; }
            if (!bubble) { bubble = addMessage("bot", ""); bubble.classList.add("cursor"); }
            raw += data.text;
            bubble.innerHTML = renderMarkdown(raw);
            scrollDown();
            break;
          case "tool_use":
            if (bubble) bubble.classList.remove("cursor");
            bubble = null; raw = "";
            if (statusEl) statusEl.remove();
            statusEl = addStatus(toolLabel(data.name));
            break;
          case "refusal":
            if (statusEl) { statusEl.remove(); statusEl = null; }
            addMessage("bot", "I'm not able to help with that request.");
            break;
          case "error":
            if (statusEl) { statusEl.remove(); statusEl = null; }
            addStatus("⚠ " + data.message).classList.add("notice");
            break;
          case "done":
            if (statusEl) { statusEl.remove(); statusEl = null; }
            if (bubble) bubble.classList.remove("cursor");
            break;
        }
      });
    } catch (err) {
      addStatus("⚠ " + err.message).classList.add("notice");
    } finally {
      if (bubble) bubble.classList.remove("cursor");
      busy = false;
      els.send.disabled = false;
      els.input.focus();
    }
  }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    els.input.value = "";
    send(text);
  });

  fetch(`/v1/public/bots/${encodeURIComponent(botId)}`)
    .then((r) => {
      if (!r.ok) throw new Error("Bot not found — check the public id.");
      return r.json();
    })
    .then((bot) => {
      els.name.textContent = bot.name;
      els.tagline.textContent = bot.tagline;
      document.title = bot.name;
      addMessage("bot", bot.greeting);
      addChips(bot.suggestedQuestions);
      els.input.focus();
    })
    .catch((err) => {
      els.name.textContent = "Unavailable";
      addStatus("⚠ " + err.message).classList.add("notice");
    });
})();
</script>
</body>
</html>
