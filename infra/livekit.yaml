# LiveKit server config for local/self-hosted voice.
# Dev keys — CHANGE for anything internet-facing.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
keys:
  devkey: devsecret_change_me_32chars_min__
# The SIP service authenticates to LiveKit with the same API key/secret.
sip:
  # LiveKit routes trunk/dispatch config via the API; no static config needed.
  use_external_ip: false
